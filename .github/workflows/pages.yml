name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the single-file bundle
        run: node scripts/build-single-file.mjs

      - name: Assemble the site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/app
          # the app, served at /app/
          cp index.html manifest.webmanifest sw.js _site/app/
          cp -r assets _site/app/assets
          # the landing page, served at /
          cp -r landing/. _site/
          # shared static assets the landing page refers to
          cp -r assets _site/assets
          cp -r screenshots _site/screenshots
          cp -r dist _site/dist
          cp LICENSE ATTRIBUTION.md _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
