name: Deploy site

# Publishes:
#   /        → the landing page (landing/)
#   /app/    → the live app
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until that toggle is flipped this workflow finishes green but skips the deploy
# and prints a notice saying so.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi

      - name: Build the single-file bundle
        run: node scripts/build-single-file.mjs

      - name: Assemble the site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/app
          cp index.html manifest.webmanifest sw.js _site/app/
          cp -r assets _site/app/assets
          cp -r landing/. _site/
          cp -r assets _site/assets
          cp -r screenshots _site/screenshots
          cp -r dist _site/dist
          cp LICENSE ATTRIBUTION.md _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
