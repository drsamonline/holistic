name: Build app packages

# Manual dispatch. Produces an Android debug APK and a Windows NSIS
# installer as workflow artifacts, then attaches them to the release for
# the current tag if one exists.
#
# Kept separate from release.yml so a toolchain failure can never block
# the HTML build from shipping.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (leave blank to skip)'
        required: false
        default: 'v2.1.0'
  # a push to this throwaway branch also runs the build, for accounts
  # where workflow_dispatch is not permitted from automation
  push:
    branches: [ci-packages]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships the Android SDK preinstalled; installing it
      # again with setup-android fails on the removed legacy 'tools' package.
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "$ANDROID_HOME/platforms" | tail -3 || true

      - name: Stage the web app
        run: |
          set -e
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r assets www/assets

      - name: Add Capacitor
        run: |
          set -e
          npm i -D --no-audit --no-fund @capacitor/cli @capacitor/core @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Align the Kotlin stdlib
        run: |
          # Capacitor 7 pulls kotlin-stdlib 1.8.x while a transitive dep
          # still asks for the 1.6.x jdk7/jdk8 shims, which duplicate
          # classes that moved into stdlib in 1.8.
          cat >> android/app/build.gradle <<'GRADLE'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          GRADLE

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/holistic-android.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: holistic-android
          path: out/holistic-android.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the single-file bundle
        run: node scripts/build-single-file.mjs

      - name: Install Electron toolchain
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          ls -R desktop/release | head -40
          cp desktop/release/*.exe out/holistic-windows-setup.exe
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: holistic-windows
          path: out/holistic-windows-setup.exe
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: [android, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what we got
        run: ls -lhR artifacts || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v2.1.0' }}
        run: |
          set -e
          shopt -s nullglob
          files=(artifacts/*.apk artifacts/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=Nothing to attach::Both package jobs failed; the HTML build remains available."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
